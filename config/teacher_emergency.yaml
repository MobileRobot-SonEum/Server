# =====================================================================
#  교사 모드 응급 지시 규칙 (팀이 직접 고치는 파일)
#  - 교사가 "아이가 넘어졌어", "피가 나" 같은 지금 벌어진 응급 상황을 말하면
#    LLM을 부르지 않고 아래 고정 안내를 바로 돌려준다. 에이전트에는 응급 대응 도구가 없다.
#  - 지난 일을 묻는 말("오늘 넘어진 사고 보고서", "넘어짐 기록")은 걸리지 않게
#    패턴은 '지금 일어난 일' 표현(넘어졌어/넘어졌대 등)으로 쓰고, exclusions로 한 번 더 거른다.
#  - 고친 뒤 서버를 다시 시작하면 적용된다. 걸린 규칙은 실행 기록(trace)에 남는다.
# =====================================================================
version: 1

reply: "응급 상황은 에이전트가 처리할 수 없어요. 비상 버튼이나 교사 앱의 비상 알림으로 바로 알리고, 현장에 직접 가 주세요."

patterns:
  - "넘어졌(어|대|다|습니다|는데|어요|대요)"
  - "다쳤(어|대|다|습니다|는데|어요|대요)"
  - "피 ?(가 )?(나|난다|나요|흘)"
  - "쓰러졌"
  - "숨(을|이)? ?(안|못) ?(쉬|셔)"
  - "경련"
  - "의식(이)? ?없"
  - "질식"
  - "목에 ?(뭐가 )?걸렸"
  - "삼켰"
  - "화상"
  - "불 ?(이 )?났"
  - "토하(고|는|면서)"
  - "머리를? ?부딪"

# 이 말이 들어 있으면 지난 일에 대한 업무 요청으로 보고 규칙을 적용하지 않는다
exclusions:
  - "보고서"
  - "기록"
  - "이벤트"
  - "내역"
  - "부모님께"
  - "부모님한테"
  - "어제"
