# =====================================================================
#  아이 발화 안전 규칙 (팀이 직접 고치는 파일)
#  - 고친 뒤 서버를 다시 시작하면 적용됩니다.
#  - 패턴은 파이썬 정규식입니다. 비교 전에 연속 공백을 하나로 합칩니다.
#  - 알림에는 어떤 규칙이 걸렸는지("등급:분류:패턴")가 남으니, 오탐·누락을 보고 여기서 조정하세요.
#  - 원칙: 애매하면 알리는 쪽(과하게 알림)을 택합니다.
# =====================================================================
version: 1

# 긴급 신호일 때 LLM 대신 돌려주는 고정 답변. 지킬 수 없는 약속("금방 올 거야")을 넣지 마세요.
urgent_fixed_reply: "선생님께 바로 알려줄게. 여기서 같이 기다리자."

# 패턴 검사 전에 문장에서 지우는 단어 (오탐 방지)
exclusions:
  - 아파트      # "아파" 오탐
  - 아프리카    # "아프" 오탐
  - 칼국수      # "칼" 오탐
  - 칼라        # "칼" 오탐

# 긴급: LLM에 넘기지 않고 고정 답변 + 긴급 교사 알림(즉시 전송)
urgent:
  pain:        # 아픔
    - "아(파|프|퍼|팠|픈)"
    - "쓰라려"
    - "따가워"
    - "어지러"
    - "토할 ?것"
    - "토했"
    - "숨(이|을)? ?(안|못) ?(쉬|셔)"
  injury:      # 다침
    - "다(쳤|쳐)"
    - "피 ?(가 )?(나|났)"
    - "넘어졌"
    - "부딪"
    - "찢어졌"
    - "멍(들|이)"
    - "삐었"
    - "데었"
  violence:    # 폭력
    - "때(렸|려|리)"
    - "(한테|에게) ?맞았"
    - "밀었"
    - "꼬집"
    - "깨물"
    - "발로 ?(찼|차)"
    - "괴롭(혀|혔|히)"
  danger:      # 위험한 행동
    - "뛰어내"
    - "삼켰"
    - "약 ?(을 )?먹었"
    - "칼"
    - "불 ?(이 )?났"
    - "불이야"
    - "혼자 ?(밖|나가)"
    - "문 ?밖에 ?나가"

# 정서: 일반 교사 알림(저장만) + LLM이 위로하는 답변
emotional:
  missing_parent:   # 보호자를 찾음
    - "(엄마|아빠|할머니|할아버지).{0,8}보고 ?싶"
    - "집에 ?가고 ?싶"
    - "(엄마|아빠) ?(언제|어디)"
  fear:             # 무서움
    - "무서"
    - "무섭"
  sadness:          # 슬픔
    - "슬(퍼|프)"
    - "울고 ?싶"
    - "속상"
    - "외로"
    - "친구가 ?없"
    - "나만 ?빼"

# LLM 답변 검사
output_guard:
  max_chars: 80
  # 걸리면 아래 기본 답변으로 바꿉니다
  fallback_reply: "그렇구나. 궁금한 건 선생님께도 같이 물어보자."
  # 정서 알림이 생긴 발화에서 쓸 기본 답변 (교사 알림이 실제로 생기므로 "알려 둘게"는 지킬 수 있는 말)
  fallback_reply_emotional: "그런 마음이 들었구나. 선생님한테도 알려 둘게."
  # 확인할 수 없는 약속
  promise_patterns:
    - "금방 ?(올|와|오실)"
    - "곧 ?(올|와|오실)"
    - "꼭 .{0,10}(할게|줄게|올게|사 ?줄)"
    - "약속(할게|해|이야|할 ?수)"
    - "(엄마|아빠|할머니|할아버지)(가|는|께서)? .{0,8}(올|오실|데리러 ?올) ?거"
    - "다 ?나을 ?거"
    - "괜찮아질 ?거"
    - "아무 ?일(도)? ?없을"
    - "절대 .{0,10}(안|않)"
  # 나이에 맞지 않는 말
  banned_patterns:
    - "죽(여|어|일|었)"
    - "총으로"
    - "칼로"
    - "바보"
    - "멍청"
