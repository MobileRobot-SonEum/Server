# 번역 서버 설정. 비밀값(API 키)은 여기 넣지 말고 .env에 넣는다.

translator:
  # api | kogpt2 | local_llm | fallback
  backend: api

api:
  # claude | openai  (모델 이름은 .env의 TRANSLATOR_MODEL로 덮어쓸 수 있음)
  provider: claude
  model: claude-haiku-5-5
  timeout_s: 3.0          # 시도 1회당 타임아웃
  retries: 1              # 실패 시 재시도 횟수
  total_deadline_s: 3.5   # 재시도를 포함한 전체 마감. 남은 시간이 없으면 재시도하지 않고 fallback
  max_tokens: 400
  few_shot_k: 4

candidates:
  low_confidence_threshold: 0.6   # 이보다 낮은 gloss가 있으면 후보를 자동으로 여러 개 생성
  auto_num_candidates: 3

cache:
  enabled: true
  max_size: 512

data:
  examples_path: data/examples.jsonl

logging:
  level: INFO
  log_raw_text: false   # true면 gloss/문장 원문을 로그에 남김 (디버깅 전용, 운영에서 켜지 말 것)
